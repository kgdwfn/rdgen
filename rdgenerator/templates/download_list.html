<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下载 - {{ platform_label }}</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#15151f; color:#e8e8f0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#1e1e2c; border:1px solid #2c2c3c; border-radius:16px; padding:32px 36px; max-width:560px; width:92%; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { font-size:1.25rem; margin:0 0 6px; }
  .sub { color:#9a9ab0; font-size:.85rem; margin:0 0 22px; word-break:break-all; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  a { display:block; padding:14px 16px; border-radius:12px; background:linear-gradient(135deg,#f5576c,#f093fb);
      color:#fff; text-decoration:none; font-weight:600; font-size:.95rem; text-align:center;
      transition:transform .12s ease, box-shadow .12s ease; }
  a:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(245,87,108,.35); }
  .foot { margin-top:20px; color:#6f6f86; font-size:.72rem; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <h1>选择下载文件</h1>
    <p class="sub">{{ platform_label }} · 构建 UUID: {{ uuid }}</p>
    <ul>
      {% for f in files %}
        <li><a href="{{ f.url }}">{{ f.name }}</a></li>
      {% endfor %}
    </ul>
    <p class="foot">由自定义客户端更新链接跳转 · 请选择对应您设备架构的包</p>
  </div>
</body>
</html>
